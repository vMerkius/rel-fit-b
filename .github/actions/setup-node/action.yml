name: Setup Node
description: Setup Node.js and install dependencies

inputs:
  node-version:
    required: false
    default: '22'

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      run: npm ci
      shell: bash
      env:
        HUSKY: 0
